<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Russia in hands</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1280 height=768 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Russia in hands</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // ---------- Landscape on phones ----------
      // 1. Android: on the first tap we go fullscreen and lock the screen to
      //    landscape (works even with the system rotation lock on).
      // 2. Whenever the screen is still portrait (iPhone, or the lock failed),
      //    the whole page is turned 90° with CSS, so the game is shown sideways
      //    and the phone itself does not need to rotate.
      // Unity does not know about the CSS turn, so while it is on we
      //   - report the canvas size as landscape (otherwise the picture stretches),
      //   - turn touch/mouse coordinates back before Unity reads them.
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1); // iPadOS
      var root = document.documentElement;
      var requestFs = root.requestFullscreen || root.webkitRequestFullscreen;
      var canLock = !!(requestFs && window.screen && screen.orientation && screen.orientation.lock);
      var rotated = false;

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function goLandscape() {
        if (!canLock) return;
        var fs = isFullscreen() ? Promise.resolve() : Promise.resolve(requestFs.call(root));
        fs.then(function() {
          return screen.orientation.lock("landscape");
        }).catch(function() { /* not allowed: the CSS turn keeps working */ });
      }

      function updateRotation() {
        var w = window.innerWidth, h = window.innerHeight;
        var shouldRotate = h > w;
        root.style.setProperty("--screen-w", w + "px");
        root.style.setProperty("--screen-h", h + "px");
        if (shouldRotate !== rotated) {
          rotated = shouldRotate;
          root.classList.toggle("rotated", rotated);
        }
      }

      if (isMobile) {
        updateRotation();
        window.addEventListener("resize", updateRotation);
        window.addEventListener("orientationchange", function() { setTimeout(updateRotation, 100); });
        setInterval(updateRotation, 500); // some browsers miss resize events after rotating

        // Canvas size as Unity should see it: its own (unturned) layout box.
        var originalRect = canvas.getBoundingClientRect.bind(canvas);
        canvas.getBoundingClientRect = function() {
          if (!rotated) return originalRect();
          var w = canvas.clientWidth, h = canvas.clientHeight;
          return { left: 0, top: 0, right: w, bottom: h, x: 0, y: 0, width: w, height: h };
        };

        // Turn pointer coordinates back: the page is rotated 90° clockwise,
        // so the game's x runs down the screen and its y runs right-to-left.
        var fixed = new WeakSet();
        function unrotate(p) {
          if (!p || fixed.has(p)) return;
          fixed.add(p);
          var sx = p.clientX, sy = p.clientY;
          var x = sy, y = window.innerWidth - sx;
          Object.defineProperty(p, "clientX", { value: x });
          Object.defineProperty(p, "clientY", { value: y });
          Object.defineProperty(p, "pageX", { value: x });
          Object.defineProperty(p, "pageY", { value: y });
        }
        function unrotateEvent(e) {
          if (!rotated) return;
          if (e.changedTouches) {
            [e.touches, e.changedTouches, e.targetTouches].forEach(function(list) {
              if (list) for (var i = 0; i < list.length; i++) unrotate(list[i]);
            });
          } else {
            unrotate(e);
          }
        }
        ["touchstart", "touchmove", "touchend", "touchcancel",
         "mousedown", "mousemove", "mouseup", "click", "wheel",
         "pointerdown", "pointermove", "pointerup", "pointercancel"].forEach(function(type) {
          window.addEventListener(type, unrotateEvent, { capture: true, passive: true });
        });

        // First tap anywhere -> fullscreen + real landscape (Android).
        var firstTap = function() {
          document.removeEventListener("touchend", firstTap, true);
          if (!isFullscreen()) goLandscape();
        };
        document.addEventListener("touchend", firstTap, true);
      }
      // ------------------------------------------

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/russia_in_hands_build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/russia_in_hands_build.data",
        frameworkUrl: buildUrl + "/russia_in_hands_build.framework.js",
        codeUrl: buildUrl + "/russia_in_hands_build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Russia in hands",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (isMobile) {
        // Mobile: the game canvas fills the whole screen.
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";


      } else {
        // Desktop: game in a window that can be maximized to fullscreen.
        canvas.style.width = "1280px";
        canvas.style.height = "768px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
